<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pizzería Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>

  <script>
    function pedirPizza(nombre) {
      const mensaje = "Hola, quiero pedir la pizza: " + nombre;

      if (navigator.share) {
        navigator.share({
          title: "Pedido de pizza",
          text: mensaje
        });
      } else {
        const url = "https://wa.me/?text=" + encodeURIComponent(mensaje);
        window.open(url, "_blank");
      }
    }
  </script>
</head>

<body class="bg-gray-100">

  <!-- Header -->
  <header class="bg-red-600 text-white p-6 text-center shadow-lg">
    <h1 class="text-3xl font-bold">🍕 Pizzería Demo</h1>
    <p class="text-sm mt-2">Pide en segundos por WhatsApp</p>
    <p class="text-xs mt-1 opacity-80">📲 Instalable como app</p>
  </header>

  <!-- Catalogo -->
  <main class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <!-- Pizza -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition fade-in">
      <div class="relative">
        <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092?q=80&w=800"
             onerror="this.src='https://via.placeholder.com/800x600?text=Pizza'"
             class="w-full h-48 object-cover">
        <span class="absolute top-2 left-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full">
          🔥 Más vendida
        </span>
      </div>
      <div class="p-4">
        <h2 class="text-xl font-bold">Pizza Pepperoni</h2>
        <p class="text-gray-600 text-sm mt-2">Clásica con extra pepperoni.</p>
        <p class="text-lg font-semibold mt-2">$150 MXN</p>
        <button onclick="pedirPizza('Pizza Pepperoni')" class="mt-4 w-full bg-green-500 text-white py-2 rounded-xl hover:bg-green-600 flex items-center justify-center gap-2">
          <i class="bi bi-whatsapp"></i> Pedir
        </button>
      </div>
    </div>

    <!-- Pizza -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition fade-in">
      <img src="https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?q=80&w=800"
           onerror="this.src='https://via.placeholder.com/800x600?text=Pizza'"
           class="w-full h-48 object-cover">
      <div class="p-4">
        <h2 class="text-xl font-bold">Pizza Hawaiana</h2>
        <p class="text-gray-600 text-sm mt-2">Jamón y piña.</p>
        <p class="text-lg font-semibold mt-2">$140 MXN</p>
        <button onclick="pedirPizza('Pizza Hawaiana')" class="mt-4 w-full bg-green-500 text-white py-2 rounded-xl hover:bg-green-600 flex items-center justify-center gap-2">
          <i class="bi bi-whatsapp"></i> Pedir
        </button>
      </div>
    </div>

  </main>

  <!-- Botón flotante -->
  <button onclick="pedirPizza('Hola, quiero información del menú')"
    class="fixed bottom-20 right-4 bg-green-500 text-white p-4 rounded-full shadow-lg hover:bg-green-600">
    <i class="bi bi-whatsapp text-xl"></i>
  </button>

  <!-- CTA -->
  <footer class="bg-gray-900 text-white text-center p-6 mt-6">
    <p class="text-lg font-semibold">🚀 Deja de imprimir volantes</p>
    <p class="text-sm mt-2">Recibe pedidos directo en WhatsApp</p>
  </footer>

  <!-- Botón instalar (SIEMPRE visible para demo) -->
  <div class="fixed bottom-4 left-0 right-0 flex justify-center">
    <button id="installBtn" class="bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg hover:bg-blue-700 flex items-center gap-2">
      <i class="bi bi-download"></i> Instalar App
    </button>
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
      } else {
        alert("Para instalar, abre este sitio en Chrome y agrégalo a pantalla de inicio 📲");
      }
    });
  </script>

</body>
</html>
