<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
.container { max-width:600px; margin:auto; border:1px solid #ddd; }
.header { background:#1d4ed8; color:white; text-align:center; padding:20px; }
.content { padding:20px; }
.button { display:inline-block; padding:10px 20px; background:#1d4ed8; color:white; text-decoration:none; border-radius:5px; }
@media(max-width:600px){ .container { width:100%; } }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Promo Especial</h2></div>
  <div class="content">
    <p>¡Hola! Te presentamos nuestra promoción exclusiva.</p>
    <a href="#" class="button">Ver más</a>
  </div>
</div>
</body>
</html>
