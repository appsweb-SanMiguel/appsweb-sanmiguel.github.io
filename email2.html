<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
.container { max-width:600px; margin:auto; border:1px solid #ddd; }
.header { background:#10b981; color:white; text-align:center; padding:20px; }
.content { padding:20px; }
.footer { background:#f3f4f6; text-align:center; padding:10px; font-size:12px; color:#555; }
.button { display:inline-block; padding:10px 20px; background:#10b981; color:white; text-decoration:none; border-radius:5px; }
@media(max-width:600px){ .container { width:100%; } }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Boletín Informativo</h2></div>
  <div class="content">
    <p>Mantente actualizado con nuestras noticias más recientes.</p>
    <a href="#" class="button">Leer más</a>
  </div>
  <div class="footer">© 2026 Juan Pérez</div>
</div>
</body>
</html>
