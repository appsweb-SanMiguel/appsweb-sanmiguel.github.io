<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmación</title>
<style>
body { margin:0; padding:0; font-family: Arial, sans-serif; background:#f3f4f6; }
.container { max-width:600px; margin:auto; border:1px solid #ddd; background:white; }
.header { background:#10b981; color:white; text-align:center; padding:20px; }
.content { padding:20px; color:#333; line-height:1.5; }
.button { display:inline-block; padding:12px 25px; background:#10b981; color:white; text-decoration:none; border-radius:5px; margin-top:15px; }
.footer { font-size:12px; color:#888; text-align:center; padding:15px; }
@media(max-width:600px){ .container { width:100%; } .button { width:100%; text-align:center; } }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h2>Confirmación de Registro</h2></div>
  <div class="content">
    <p>¡Gracias por registrarte! Tu cuenta ha sido creada exitosamente y ya puedes disfrutar de todos nuestros servicios.</p>
    <a href="#" class="button">Ir a mi cuenta</a>
  </div>
  <div class="footer">Si no realizaste este registro, <a href="#">haz clic aquí</a>.</div>
</div>
</body>
</html>
